version: 2
updates:
    - package-ecosystem: 'npm'
      directory: '/'
      schedule:
          interval: 'daily'
      open-pull-requests-limit: 10
      labels:
          - 'dependencies'
          - 'dependabot'
      groups:
          npm-minor-patch:
              update-types:
                  - 'minor'
                  - 'patch'
    - package-ecosystem: 'docker'
      directory: '/'
      schedule:
          interval: 'daily'
      open-pull-requests-limit: 10
      labels:
          - 'dependencies'
          - 'dependabot'
      groups:
          docker-minor-patch:
              update-types:
                  - 'minor'
                  - 'patch'
    - package-ecosystem: 'github-actions'
      directory: '/'
      schedule:
          interval: 'daily'
      open-pull-requests-limit: 10
      labels:
          - 'dependencies'
          - 'dependabot'
      groups:
          github-actions-minor-patch:
              update-types:
                  - 'minor'
                  - 'patch'
